<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIPHOP ニューリリース</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f472b6;
      --accent-2: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    header { border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.04em; }
    .updated { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    h2 {
      font-size: 1rem; letter-spacing: 0.08em; color: var(--accent-2);
      margin: 32px 0 12px; text-transform: uppercase;
    }
    h2:first-of-type { margin-top: 0; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }
    li:hover { transform: translateX(2px); border-color: var(--accent); }
    li a {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; color: inherit; text-decoration: none;
    }
    .date {
      flex: 0 0 auto; background: #334155; color: var(--accent);
      font-size: 0.75rem; font-weight: 600; padding: 3px 10px;
      border-radius: 999px; white-space: nowrap; margin-top: 3px;
    }
    .body { flex: 1 1 auto; min-width: 0; }
    .artist { font-size: 1.02rem; font-weight: 600; }
    .title { color: var(--muted); font-size: 0.9rem; }
    .kind {
      display: inline-block; font-size: 0.7rem; color: var(--muted);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 0 6px; margin-left: 6px; vertical-align: 1px;
    }
    .added { color: #4ade80; font-size: 0.78rem; margin-left: 6px; }
    .why { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    .status { color: var(--muted); text-align: center; padding: 32px 0; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>HIPHOP ニューリリース</h1>
      <div class="updated" id="updated">読み込み中…</div>
    </header>

    <section id="releases-section" hidden>
      <h2>フォロー中アーティストの新譜</h2>
      <ul id="releases"></ul>
    </section>

    <section id="discover-section" hidden>
      <h2>今週の2人（未フォロー）</h2>
      <ul id="discover"></ul>
    </section>

    <div class="status" id="status"></div>
    <footer>タップすると Apple Music が開きます</footer>
  </div>

  <script>
    function formatUpdated(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ` +
             `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function row(parts) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = parts.url || "#";
      if (parts.url) { a.target = "_blank"; a.rel = "noopener"; }

      const date = document.createElement("span");
      date.className = "date";
      date.textContent = parts.badge;

      const body = document.createElement("span");
      body.className = "body";

      const artist = document.createElement("div");
      artist.className = "artist";
      artist.textContent = parts.artist;
      if (parts.kind) {
        const k = document.createElement("span");
        k.className = "kind";
        k.textContent = parts.kind;
        artist.appendChild(k);
      }
      if (parts.added) {
        const ok = document.createElement("span");
        ok.className = "added";
        ok.textContent = "✓ 追加済み";
        artist.appendChild(ok);
      }
      body.appendChild(artist);

      if (parts.title) {
        const t = document.createElement("div");
        t.className = "title";
        t.textContent = parts.title;
        body.appendChild(t);
      }
      if (parts.why) {
        const w = document.createElement("div");
        w.className = "why";
        w.textContent = parts.why;
        body.appendChild(w);
      }

      a.appendChild(date);
      a.appendChild(body);
      li.appendChild(a);
      return li;
    }

    function render(data) {
      document.getElementById("updated").textContent =
        "更新: " + (formatUpdated(data.updated) || "未生成") +
        (data.week ? "　対象: " + data.week : "");

      const releases = Array.isArray(data.releases) ? data.releases : [];
      const discover = Array.isArray(data.discover) ? data.discover : [];

      if (releases.length) {
        const ul = document.getElementById("releases");
        for (const r of releases) {
          ul.appendChild(row({
            badge: (r.releaseDate || "").slice(5) || "—",
            artist: r.artist || "(不明)",
            title: r.title || "",
            kind: r.kind === "song" ? "single" : r.kind,
            added: r.added === true,
            url: r.url,
          }));
        }
        document.getElementById("releases-section").hidden = false;
      }

      if (discover.length) {
        const ul = document.getElementById("discover");
        for (const d of discover) {
          ul.appendChild(row({
            badge: "NEW",
            artist: d.name || "(不明)",
            title: d.startWith ? "まずこの1曲: " + d.startWith : "",
            why: d.why,
            url: d.url,
          }));
        }
        document.getElementById("discover-section").hidden = false;
      }

      document.getElementById("status").textContent =
        releases.length || discover.length ? "" :
        "今週のデータがまだありません。日曜の生成を待つか、fetch-releases.mjs を実行してください。";
    }

    fetch("releases.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("updated").textContent = "";
        document.getElementById("status").textContent =
          "データの読み込みに失敗しました: " + err.message;
      });
  </script>
</body>
</html>
