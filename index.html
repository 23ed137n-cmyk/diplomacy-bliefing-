<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外交ブリーフィング</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --priority-border: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --accent: #38bdf8;
      --tag-bg: #334155;
      --tag-text: #cbd5e1;
      --border: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 16px 72px;
    }
    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 16px;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: 0.04em;
      font-weight: 700;
    }
    .updated {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .summary {
      color: var(--faint);
      font-size: 0.82rem;
      margin-top: 10px;
    }
    .summary b { color: var(--accent); font-weight: 600; }

    section.group { margin-top: 26px; }
    .group-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .group-head .count {
      margin-left: auto;
      color: var(--faint);
      font-weight: 500;
      font-size: 0.8rem;
    }
    .group-head .bar {
      width: 4px; height: 18px; border-radius: 2px;
      background: var(--accent);
      display: inline-block;
    }
    .group-head.has-priority .bar { background: var(--priority-border); }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 9px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    li.priority {
      background: linear-gradient(180deg, #3b1416, #2a1113);
      border-color: var(--priority-border);
    }
    .num {
      flex: 0 0 auto;
      width: 22px;
      text-align: right;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      padding-top: 3px;
    }
    li.priority .num { color: #fca5a5; }
    .body { flex: 1 1 auto; min-width: 0; }
    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    li.priority .tag { background: #991b1b; color: #fecaca; }
    .star { color: #fbbf24; font-size: 0.85rem; }
    .title {
      font-size: 1.03rem;
      font-weight: 500;
      word-break: break-word;
    }
    .status { color: var(--muted); text-align: center; padding: 32px 0; }
    footer {
      margin-top: 40px;
      color: var(--faint);
      font-size: 0.78rem;
      text-align: center;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.35rem; }
      .title { font-size: 0.98rem; }
      li { padding: 12px 13px; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-row">
        <h1>外交ブリーフィング</h1>
        <div class="updated" id="updated">読み込み中…</div>
      </div>
      <div class="summary" id="summary"></div>
    </header>
    <div id="content"></div>
    <div class="status" id="status"></div>
    <footer>Diplomacy Briefing &mdash; 表示確認用サンプル</footer>
  </div>

  <script>
    // 地域の表示順（このブリーフィングの区分）
    const REGION_ORDER = [
      "日本", "ASEAN", "中国", "朝鮮半島", "西アジア", "中東",
      "東アフリカ", "西アフリカ",
      "西ヨーロッパ", "東ヨーロッパ", "北ヨーロッパ", "南ヨーロッパ",
      "ロシア", "アメリカ", "北米", "中南米", "大洋州"
    ];

    function formatUpdated(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ` +
             `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function createItem(item, number) {
      const li = document.createElement("li");
      if (item.priority) li.classList.add("priority");

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = number;

      const body = document.createElement("div");
      body.className = "body";

      const meta = document.createElement("div");
      meta.className = "meta";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = item.tag || "—";
      meta.appendChild(tag);
      if (item.priority) {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = "★";
        star.title = "重要";
        meta.appendChild(star);
      }

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title || "(無題)";

      body.appendChild(meta);
      body.appendChild(title);
      li.appendChild(num);
      li.appendChild(body);
      return li;
    }

    function createSection(region, items, startNo) {
      const hasPriority = items.some((it) => it.priority === true);
      const section = document.createElement("section");
      section.className = "group";

      const head = document.createElement("div");
      head.className = "group-head" + (hasPriority ? " has-priority" : "");
      const bar = document.createElement("span");
      bar.className = "bar";
      const labelSpan = document.createElement("span");
      labelSpan.textContent = region;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = items.length + "件";
      head.appendChild(bar);
      head.appendChild(labelSpan);
      head.appendChild(count);

      const ul = document.createElement("ul");
      items.forEach((item, i) => ul.appendChild(createItem(item, startNo + i)));

      section.appendChild(head);
      section.appendChild(ul);
      return section;
    }

    function render(data) {
      const items = Array.isArray(data.items) ? data.items : [];
      document.getElementById("updated").textContent =
        "更新: " + (formatUpdated(data.updated) || "不明");

      // 地域ごとにまとめる
      const byRegion = new Map();
      for (const it of items) {
        const r = it.region || "その他";
        if (!byRegion.has(r)) byRegion.set(r, []);
        byRegion.get(r).push(it);
      }

      // 表示順：規定の地域順 → 規定外はその後ろ
      const ordered = REGION_ORDER.filter((r) => byRegion.has(r));
      for (const r of byRegion.keys()) {
        if (!ordered.includes(r)) ordered.push(r);
      }

      const priorityCount = items.filter((it) => it.priority === true).length;
      document.getElementById("summary").innerHTML =
        `重要 <b>${priorityCount}</b> 件 ／ 全 <b>${items.length}</b> 件 ／ <b>${ordered.length}</b> 地域`;

      const content = document.getElementById("content");
      content.innerHTML = "";
      let no = 1;
      for (const r of ordered) {
        // 各地域内は重要を先頭に、元の並び順を保持
        const group = byRegion.get(r)
          .map((item, i) => ({ item, i }))
          .sort((a, b) => (b.item.priority === true) - (a.item.priority === true) || a.i - b.i)
          .map((x) => x.item);
        content.appendChild(createSection(r, group, no));
        no += group.length;
      }

      document.getElementById("status").textContent =
        items.length ? "" : "表示できる項目がありません。";
    }

    fetch("data.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("updated").textContent = "";
        document.getElementById("summary").textContent = "";
        document.getElementById("status").textContent =
          "データの読み込みに失敗しました: " + err.message;
      });
  </script>
</body>
</html>
